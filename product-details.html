<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Preview - j4ma MotorShop</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="Backgroundlogo.jpg">

</head>

<body>

<header>

    <div class="logo">
    <img src="Backgroundlogo.jpg" alt="j4ma MotorShop Logo">
        j4ma MotorShop
    </div>
    

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <a href="cart.html" class="btn-cart">
        🛒 Cart (<span id="cart-count">0</span>)
    </a>

</header>


<!-- PRODUCT PREVIEW -->

<section class="product-preview">

    <div class="preview-left">

        <!-- MAIN IMAGE -->
        <img id="mainImage"
             src="" alt="Product"
             class="main-product-image">

        <!-- OTHER PICTURES -->
        <div id="thumbnails" class="thumbnails"></div>

    </div>


    <div class="preview-right">

        <h1 id="productName">
            Product Name
        </h1>

        <div class="rating">
            ⭐⭐⭐⭐
        </div>

        <h2 id="productPrice">
            ₱0
        </h2>

        <p id="productDescription">
            Product description
        </p>


        <!-- VIDEO -->

        <h3>🎥 Product Video</h3>

         <video id="productVideo"
               class="product-video"
               controls
               muted>

            <source id="videoSource" src="" type="video/mp4">

            Your browser does not support video.
        </video>
        


        <!-- ADD TO CART -->

        <button id="addCartButton"
                class="add-cart">
            🛒 Add to Cart
        </button>


        <a href="products.html"
           class="back-products">
            ← Back to Products
        </a>

    </div>

</section>


<script>

},

    ],

},

decals: {

    },

    bomxshock: {

    },

        description: "Modified brake disc designed for motorcycle performance.",

            "discbrake.jpg",
        ],

    },

    ayotorbgtail: {

        price: 3500,
        description: "RGB LED tail light with stylish lighting effects.",
        images: [
            "ayotorbgtail3.jpg",

            "ayotorbgtail5.jpg",

        ],
        video: "ayotorbgtail2.mp4"
    },

    tirehugger: {
        name: "Tire Hugger",

        images: [

        ],
        video: "tirehugger2.mp4"
    },

    ayotorgb: {
        name: "AYOTO RGB LED Headlight",
        price: 1800,

    cncfoot: {

        ],

    },

    brembo: {

        price: 950,

        images: [

            "brembohandbraker5.jpg",
        ],

    },

    ramair: {

        ],

    },

    sidemirror: {
        name: "CNC Side Mirror",

        description: "Stylish CNC motorcycle side mirrors.",
        images: [
            "dynamosidemirror3.jpg",

            "dynamosidemirror5.jpg",
            "dynamosidemirror.jpg",
        ],
        video: "sidemirror2.mp4"
    }

};




const urlParams = new URLSearchParams(window.location.search);

const productID = urlParams.get("product");

const product = products[productID];




if (product) {

    document.getElementById("productName").textContent =
        product.name;

    document.getElementById("productPrice").textContent =
        "₱" + product.price.toLocaleString();

    document.getElementById("productDescription").textContent =
        product.description;


    

    document.getElementById("mainImage").src =
        product.images[0];


    

    const thumbnails =
        document.getElementById("thumbnails");

    product.images.forEach(function(image) {

        const img = document.createElement("img");

        img.src = image;

        img.className = "thumbnail";

        img.onclick = function() {

            document.getElementById("mainImage").src =
                image;

        };

        thumbnails.appendChild(img);

    });


    

    const video =
        document.getElementById("productVideo");

    video.querySelector("source").src =
        product.video;

    video.load();


    

    document.getElementById("addCartButton").onclick =
        function() {

            addToCart(
                product.name,
                product.price,
                product.images[0]
            );

        };

}




function addToCart(name, price, image) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    let existing =
        cart.find(item => item.name === name);


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            name: name,
            price: price,
            image: image,
            quantity: 1

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    updateCartCount();


    alert(name + " has been added to your cart!");

}




function updateCartCount() {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    let count = cart.reduce(
        (total, item) =>
            total + item.quantity,
        0
    );


    document.getElementById("cart-count")
        .textContent = count;

}


updateCartCount();

</script>


</body>
</html>
